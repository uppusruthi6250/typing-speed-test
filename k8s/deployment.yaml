apiVersion: apps/v1
kind: Deployment
metadata:
  name: typing-speed-test
  labels:
    app: typing-speed-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: typing-speed-test
  template:
    metadata:
      labels:
        app: typing-speed-test
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: typing-speed-test
          image: typing-speed-test:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: DATABASE_PATH
              value: /app/data/typing_test.db
          volumeMounts:
            - name: result-data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: result-data
          persistentVolumeClaim:
            claimName: typing-speed-test-data
