
apiVersion: apps/v1
kind: Deployment
metadata:
  name: typing-speed-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: typing-speed-test
  template:
    metadata:
      labels:
        app: typing-speed-test
    spec:
      containers:
        - name: typing-speed-test
          image: uppusruthi6250/typing-speed-test:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
